<!DOCTYPE html>

<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Fórmula Resolvente</title>
</head>
<body>
  <script>
    let a = Number(prompt("Valor de a:1"));
    let b = Number(prompt("Valor de b:-5"));
    let c = Number(prompt("Valor de c:6"));´
    let delta = b * b - 4 * a * c;
    if (delta >= 0) {
      let x1 = (-b + Math.sqrt(delta)) / (2 * a);
      let x2 = (-b - Math.sqrt(delta)) / (2 * a);
      alert("x1 = " + x1 + " e x2 = " + x2);
    } else {
      alert("x1 = " x1.toFixed(2) + " e x2 = " x2.toFixed(2));
    }
  </script>
</body>
</html>
